---
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach integration zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Zip the integration
        run: |
          cd custom_components/ariston
          zip -r "${GITHUB_WORKSPACE}/ariston-net-ha-primos-heat-pump.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ariston-net-ha-primos-heat-pump.zip --clobber
